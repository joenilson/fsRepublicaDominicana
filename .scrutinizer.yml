build:
  dependencies:
    before:
      # Scrutinizer no tiene FacturaScripts: se clona el núcleo solo para resolver las clases
      - git clone --depth 1 https://github.com/NeoRazorX/facturascripts.git .fs-core
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
      environment:
        php:
          version: 8.2
filter:
  excluded_paths:
    - 'vendor/*'
    - '.fs-core/*'
  dependency_paths:
    - 'vendor/*'
    - '.fs-core/*'
